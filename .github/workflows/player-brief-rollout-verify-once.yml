name: Player Brief rollout verification once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  verify:
    if: github.event.issue.title == 'RUN PLAYER BRIEF ROLLOUT VERIFY 2026-08-19'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Canonicalize root lock with npm
        run: |
          npm install --package-lock-only --ignore-scripts
          if git diff --quiet -- package-lock.json; then
            echo 'LOCK_CHANGED=false' >> "$GITHUB_ENV"
          else
            echo 'LOCK_CHANGED=true' >> "$GITHUB_ENV"
          fi
      - name: Reproducible clean install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Domain regression
        run: npm test
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Next production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ispfhvdelglwvixaspza.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
        run: npm run build
      - name: Verify worker dependency install
        working-directory: workers/chatgpt-consumer
        run: npm install --ignore-scripts
      - name: Record result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "PASS: npm canonical lock check, npm ci, lint, domain tests, TypeScript, Next build, and worker dependency install. LOCK_CHANGED=${LOCK_CHANGED}."
      - name: Commit canonical lock and remove one-off workflow
        run: |
          git config user.name 'Arkan'
          git config user.email '98953892+karkandea@users.noreply.github.com'
          git add package-lock.json
          git rm .github/workflows/player-brief-rollout-verify-once.yml
          git commit -m 'chore: canonicalize package lock and verify rollout'
          git push origin HEAD:main
