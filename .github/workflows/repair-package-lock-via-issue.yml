name: Repair package lock via issue

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  repair-lock:
    if: github.event.issue.title == 'RUN ONE-OFF PACKAGE LOCK REPAIR'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean install
        run: npm ci
      - name: Full build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ispfhvdelglwvixaspza.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
        run: npm run build
      - name: Commit repaired lock and remove one-off workflow
        run: |
          git config user.name 'Arkan'
          git config user.email '98953892+karkandea@users.noreply.github.com'
          git add package-lock.json
          git rm .github/workflows/repair-package-lock-via-issue.yml
          git commit -m 'chore: sync package lock'
          git push
