name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install --package-lock=false

      - name: Install worker dependencies
        run: npm --prefix workers/chatgpt-consumer install --package-lock=false

      - name: Check worker syntax
        run: node --check workers/chatgpt-consumer/worker.mjs

      - name: Build, lint, and domain tests
        run: npm run build
