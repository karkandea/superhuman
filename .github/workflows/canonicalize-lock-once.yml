name: Canonicalize stale package lock once

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  canonicalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/player-brief-production-complete'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate lock with npm
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify canonical clean install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Domain regression
        run: npm test
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Next production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ispfhvdelglwvixaspza.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
        run: npm run build
      - name: Commit generated lock to PR branch
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already canonical'
            exit 0
          fi
          git config user.name 'Arkan'
          git config user.email '98953892+karkandea@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: regenerate package lock with npm'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
