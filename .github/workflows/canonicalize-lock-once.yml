name: Finalize canonical package lock

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  canonicalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/player-brief-finalize'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lock with npm
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify exact canonical hash
        shell: bash
        run: |
          actual="$(sha256sum package-lock.json | awk '{print $1}')"
          expected="fa6613b469241ee765a3c1e45cd3798d93e5f34323a35f38f2adfc3736002e38"
          echo "expected=$expected"
          echo "actual=$actual"
          test "$actual" = "$expected"
      - name: Verify canonical clean install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Domain regression
        run: npm test
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Next production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ispfhvdelglwvixaspza.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
        run: npm run build
      - name: Commit generated lock to PR branch
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already canonical'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix: repair root npm lockfile'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
